name: Backfill Subjects (one-off)

# Manual only — this is a one-time maintenance job to fill missing `subject`
# fields on historical records. Run it from the Actions tab when needed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60      # backfill re-scans all windows; give it room
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Backfill subjects on historical records
        run: python backfill_subjects.py

      - name: Save the data store
        run: |
          git config user.name "tender-bot"
          git config user.email "tender-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Backfill subjects $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "Saved on attempt $i."; exit 0
            fi
            echo "Attempt $i failed — retrying."; sleep 10
          done
          exit 1
