name: Build Account Map

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Build the account map
        run: python build_accounts.py

      - name: Publish the page
        run: |
          git config user.name "tender-bot"
          git config user.email "tender-bot@users.noreply.github.com"

          if [ ! -f docs/accounts.html ]; then
            echo "No page was produced — nothing to publish."
            exit 1
          fi

          git add docs/accounts.html
          if git diff --staged --quiet; then
            echo "Page unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "Update account map"

          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "Published on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed — retrying in 10s."
            sleep 10
          done

          echo "Could not publish after 3 attempts."
          exit 1
