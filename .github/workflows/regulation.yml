name: Build Regulatory Radar

on:
  schedule:
    - cron: "51 5 * * *"   # daily, off-peak
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Build the regulatory radar
        run: python build_regulation.py

      - name: Publish the page
        run: |
          git config user.name "tender-bot"
          git config user.email "tender-bot@users.noreply.github.com"
          git add docs/regulation.html
          if git diff --staged --quiet; then
            echo "No change."; exit 0
          fi
          git commit -m "Update regulatory radar"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "Published on attempt $i."; exit 0
            fi
            echo "Attempt $i failed — retrying."; sleep 10
          done
          exit 1
