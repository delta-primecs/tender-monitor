name: Build Changes Feed

on:
  schedule:
    - cron: "31 4,17 * * *"   # ~20 min after ingest, so the log is fresh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the changes feed
        run: python build_changes.py

      - name: Publish the page
        run: |
          git config user.name "tender-bot"
          git config user.email "tender-bot@users.noreply.github.com"
          git add docs/changes.html
          if git diff --staged --quiet; then
            echo "No change."; exit 0
          fi
          git commit -m "Update changes feed"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "Published on attempt $i."; exit 0
            fi
            echo "Attempt $i failed — retrying."; sleep 10
          done
          exit 1
