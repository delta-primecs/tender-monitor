name: Enrich contract store (manual)

# Fills data gaps from public sources (see enrich_store.py):
#   full   = CPV rescan from 2020 + title safety net from 2020 + text estimates
#   recent = same, last 45 days only (the Pipeline runs this daily)
#   text   = only end-date estimates from contract texts (offline)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full | recent | text"
        required: false
        default: "full"
        type: string
      from_year:
        description: "full only: first year (default 2020)"
        required: false
        default: ""
        type: string
      to_year:
        description: "full only: last year (default: up to today)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: pipeline          # never runs at the same time as the Pipeline
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Enrich (saves & pushes progress as it goes)
        env:
          ENRICH_COMMIT: "1"
          PYTHONUNBUFFERED: "1"
        run: python enrich_store.py "--${{ github.event.inputs.mode }}" ${{ github.event.inputs.from_year }} ${{ github.event.inputs.to_year }}
      - name: Save
        run: |
          git config user.name "tender-bot"
          git config user.email "tender-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Enrich store (${{ github.event.inputs.mode }}) $(TZ=Europe/Athens date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep 10
          done
          exit 1
