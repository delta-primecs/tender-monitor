name: Ingest Contracts

on:
  schedule:
    - cron: "11 4,17 * * *"   # twice daily (07:11 & 20:11 Athens) — everything reads from this
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install OCR tools (tesseract + Greek, poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ell poppler-utils

      - name: Install dependencies
        run: pip install requests pdfplumber pytesseract pdf2image

      - name: Ingest new contracts
        run: python ingest_contracts.py

      - name: Save the data store
        run: |
          git config user.name "tender-bot"
          git config user.email "tender-bot@users.noreply.github.com"
          git add data/ docs/contracts/
          if git diff --staged --quiet; then
            echo "Nothing new to store."
            exit 0
          fi
          git commit -m "Ingest contracts $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "Saved on attempt $i."; exit 0
            fi
            echo "Attempt $i failed — retrying."; sleep 10
          done
          exit 1
