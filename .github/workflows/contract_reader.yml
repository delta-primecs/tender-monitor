name: Contract Reader (ad-hoc)

# Give it an ΑΔΑΜ → produces the FULL contract text as a clean, readable
# terminal-style page: every article, deliverable, term — nothing dropped.
# View at https://delta-primecs.github.io/tender-monitor/contracts/<ADAM>.html
on:
  workflow_dispatch:
    inputs:
      adam:
        description: "ΑΔΑΜ της σύμβασης (π.χ. 25SYMV018273925)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install OCR tools (tesseract + Greek, poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ell poppler-utils

      - name: Install Python dependencies
        run: pip install requests pdfplumber pytesseract pdf2image

      - name: Extract full contract text
        run: python contract_reader.py "${{ github.event.inputs.adam }}"

      - name: Publish
        run: |
          git config user.name "tender-bot"
          git config user.email "tender-bot@users.noreply.github.com"
          git add docs/contracts/
          if git diff --staged --quiet; then
            echo "Nothing produced (download or parse failed?)."
            exit 1
          fi
          git commit -m "Contract text ${{ github.event.inputs.adam }}"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "Published on attempt $i."; exit 0
            fi
            echo "Attempt $i failed — retrying."; sleep 10
          done
          exit 1
