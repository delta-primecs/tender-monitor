name: Build Tender Dashboard

on:
  schedule:
    - cron: "0 5,18 * * *"   # twice daily (was hourly — pointless since ΚΗΜΔΗΣ updates daily)
  workflow_dispatch:       # lets you press "Run workflow" to build it on demand

permissions:
  contents: write          # needed to save docs/index.html back to the repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Build the dashboard
        run: python build_dashboard.py

      - name: Publish the updated page
        run: |
          git config user.name "tender-bot"
          git config user.email "tender-bot@users.noreply.github.com"
          git add docs/index.html
          if git diff --staged --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Update dashboard $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "Saved on attempt $i."; exit 0
            fi
            echo "Attempt $i failed — retrying."; sleep 10
          done
          exit 1
