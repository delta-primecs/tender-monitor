<!doctype html>
<html lang="el"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat · DeltaPrime</title>
<link rel="stylesheet" href="godel.css">
<style>
  .wrap{max-width:none;margin:0 auto}
  .deskbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--hair);padding:8px 14px}
  .db-title{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--bright);
    letter-spacing:.06em;text-transform:uppercase}
  .db-sub{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;
    padding-left:14px;border-left:1px solid var(--hair2)}
  .db-stats{margin-left:auto;font-size:11px;color:var(--muted)}
  .db-stats b{color:var(--accent)}

  .chatwrap{background:var(--card);border:1px solid var(--hair);border-top:0;
    display:flex;flex-direction:column;height:calc(100vh - 130px)}
  .messages{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
  .msg{padding:5px 0;display:flex;gap:12px;align-items:baseline;
    border-bottom:1px solid transparent}
  .msg .who{color:var(--accent);font-weight:700;font-size:12px;min-width:110px;
    white-space:nowrap;text-align:right}
  .msg.me .who{color:var(--link)}
  .msg .txt{flex:1;color:var(--text);font-size:13.5px;word-break:break-word}
  .msg .tm{color:var(--muted);font-size:10.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .sysline{color:var(--muted);font-size:11px;text-align:center;padding:8px}

  .composer{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--hair);
    background:var(--panel)}
  .composer input{flex:1;background:var(--page);border:1px solid var(--hair2);
    color:var(--text);font-family:var(--mono);font-size:14px;padding:10px 12px;outline:none}
  .composer input:focus{border-color:var(--accent)}
  .composer button{background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent);
    font-family:var(--mono);font-weight:700;font-size:12px;text-transform:uppercase;
    letter-spacing:.05em;padding:0 18px;cursor:pointer}
  .composer button:hover{background:var(--accent);color:var(--page)}
</style></head><body>
<div id="nav"></div>
<div class="wrap">
  <div class="deskbar">
    <span class="db-title">CHAT</span>
    <span class="db-sub">Ομάδα DeltaPrime</span>
    <div class="db-stats">Συνδεδεμένος ως <b id="me">…</b></div>
  </div>
  <div class="chatwrap">
    <div class="messages" id="messages">
      <div class="sysline" id="sys">Φόρτωση μηνυμάτων…</div>
    </div>
    <div class="composer">
      <input id="input" type="text" maxlength="2000" autocomplete="off"
             placeholder="Γράψε μήνυμα και Enter…">
      <button id="send">Αποστολή</button>
    </div>
  </div>
</div>
<script src="nav.js"></script>
<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const meEl = document.getElementById('me');
let myName = null, lastCount = 0, seenIds = new Set();

function pad(n){return String(n).padStart(2,'0');}
function fmtTime(ts){const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes());}

function addMessage(m){
  if(seenIds.has(m.id)) return;
  seenIds.add(m.id);
  // drop the "loading" line on first real message
  const sys=document.getElementById('sys'); if(sys) sys.remove();
  const isMe = myName && m.name===myName;
  const el=document.createElement('div');
  el.className='msg'+(isMe?' me':'');
  el.innerHTML='<span class="who">'+escapeHtml(m.name)+'</span>'+
    '<span class="txt">'+escapeHtml(m.text)+'</span>'+
    '<span class="tm">'+fmtTime(m.ts)+'</span>';
  messagesEl.appendChild(el);
}
function escapeHtml(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function loadMessages(){
  try{
    const r=await fetch('/api/chat',{cache:'no-store'});
    const d=await r.json();
    if(!d.ok){ showSys(d.error==='KV not bound'
        ? 'Το chat δεν έχει ρυθμιστεί ακόμα (KV binding). Δες τον οδηγό.'
        : 'Σφάλμα φόρτωσης.'); return; }
    const atBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 60;
    d.messages.forEach(addMessage);
    if(atBottom) messagesEl.scrollTop = messagesEl.scrollHeight;
  }catch(e){ /* network hiccup — ignore, next poll retries */ }
}
function showSys(t){ const s=document.getElementById('sys'); if(s) s.textContent=t;
  else { const el=document.createElement('div'); el.className='sysline'; el.textContent=t; messagesEl.appendChild(el);} }

async function send(){
  const text=inputEl.value.trim();
  if(!text) return;
  inputEl.value='';
  try{
    const r=await fetch('/api/chat',{method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({text})});
    const d=await r.json();
    if(d.ok){
      if(!myName){ myName=d.message.name; meEl.textContent=myName; }
      addMessage(d.message);
      messagesEl.scrollTop=messagesEl.scrollHeight;
    } else {
      showSys('Δεν στάλθηκε: '+(d.error||'σφάλμα'));
    }
  }catch(e){ showSys('Δεν στάλθηκε (δίκτυο). Δοκίμασε ξανά.'); }
}

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); send(); }});

loadMessages();
setInterval(loadMessages, 4000);   // poll every 4s
</script>
</body></html>
