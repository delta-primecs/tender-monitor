<!doctype html>
<html lang="el"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Διαύγεια · DeltaPrime</title>
<link rel="stylesheet" href="godel.css">
<style>
  .wrap{max-width:none;margin:0 auto}
  .deskbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--hair);padding:8px 14px}
  .db-title{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--bright);
    letter-spacing:.06em;text-transform:uppercase}
  .db-sub{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;
    padding-left:14px;border-left:1px solid var(--hair2)}
  .db-stats{margin-left:auto;font-size:11px;color:var(--muted)}
  .db-stats b{color:var(--accent)}

  .searchbar{display:flex;gap:8px;padding:12px 14px;background:var(--card);
    border:1px solid var(--hair);border-top:0}
  .searchbar input{flex:1;background:var(--page);border:1px solid var(--hair2);
    color:var(--text);font-family:var(--mono);font-size:14px;padding:11px 12px;outline:none}
  .searchbar input:focus{border-color:var(--accent)}
  .searchbar button{background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent);
    font-family:var(--mono);font-weight:700;font-size:12px;text-transform:uppercase;
    letter-spacing:.05em;padding:0 20px;cursor:pointer}
  .searchbar button:hover{background:var(--accent);color:var(--page)}

  .results{background:var(--card);border:1px solid var(--hair);border-top:0;
    min-height:200px;padding:4px 0}
  .row{padding:12px 16px;border-bottom:1px solid var(--hair)}
  .row:last-child{border-bottom:0}
  .row .top{display:flex;gap:12px;align-items:baseline;justify-content:space-between}
  .row .subj{color:var(--bright);font-size:13.5px;font-weight:600;line-height:1.45;flex:1}
  .row .date{color:var(--muted);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .row .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .row .org{color:var(--link);font-size:12px}
  .row .type{color:var(--signal,#e8a13a);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    background:var(--signal-bg,#2a2010);padding:2px 7px;border-radius:4px}
  .row .ada{color:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
  .row .links{margin-left:auto;display:flex;gap:8px}
  .row .links a{color:var(--link);font-size:11px;text-decoration:none;border:1px solid var(--hair2);
    padding:3px 9px;border-radius:5px;white-space:nowrap}
  .row .links a:hover{border-color:var(--link);background:var(--panel)}

  .state{color:var(--muted);font-size:12.5px;text-align:center;padding:40px 16px}
  .state b{color:var(--text)}
  .more{display:block;width:100%;background:var(--panel);color:var(--accent);
    border:1px solid var(--hair);font-family:var(--mono);font-size:12px;font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;padding:12px;cursor:pointer}
  .more:hover{background:var(--accent-dim)}
  .hint{color:var(--muted);font-size:11px;padding:8px 16px}
</style></head><body>
<div id="nav"></div>
<div class="wrap">
  <div class="deskbar">
    <span class="db-title">ΔΙΑΥΓΕΙΑ</span>
    <span class="db-sub">Αναζήτηση αποφάσεων — πλήρες κείμενο</span>
    <div class="db-stats" id="stats"></div>
  </div>
  <div class="searchbar">
    <input id="dq" type="text" autocomplete="off" spellcheck="false"
           placeholder="π.χ.  ΟΙΚΟΝΟΜΙΚΕΣ ΚΑΤΑΣΤΑΣΕΙΣ ΛΙΜΕΝΙΚΟ ΤΑΜΕΙΟ ΣΚΑΛΑΣ ΩΡΩΠΟΥ">
    <button id="go">Αναζήτηση</button>
  </div>
  <div class="results" id="results">
    <div class="state">Γράψε όρους και πάτα <b>Enter</b> — ψάχνει σε όλη τη Διαύγεια.</div>
  </div>
</div>
<script src="nav.js"></script>
<script>
const box = document.getElementById('dq');
const goBtn = document.getElementById('go');
const resultsEl = document.getElementById('results');
const statsEl = document.getElementById('stats');
let curQ = "", curPage = 0, curTotal = 0, loading = false;

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function rowHtml(it){
  const links =
    (it.doc  ? '<a href="'+it.doc+'" target="_blank" rel="noopener">PDF ↗</a>' : '') +
    (it.view ? '<a href="'+it.view+'" target="_blank" rel="noopener">Απόφαση ↗</a>' : '');
  return '<div class="row">'+
    '<div class="top"><div class="subj">'+esc(it.subject)+'</div>'+
      '<div class="date">'+esc(it.date||'')+'</div></div>'+
    '<div class="meta">'+
      (it.org ? '<span class="org">'+esc(it.org)+'</span>' : '')+
      (it.type ? '<span class="type">'+esc(it.type)+'</span>' : '')+
      (it.ada ? '<span class="ada">'+esc(it.ada)+'</span>' : '')+
      '<span class="links">'+links+'</span>'+
    '</div></div>';
}

async function run(q, page){
  if(loading) return;
  if(!q){ return; }
  loading = true;
  if(page === 0){
    curQ = q; curPage = 0;
    resultsEl.innerHTML = '<div class="state">Αναζήτηση στη Διαύγεια…</div>';
    statsEl.textContent = '';
  } else {
    const b = document.getElementById('moreBtn');
    if(b){ b.textContent = 'Φόρτωση…'; b.disabled = true; }
  }
  try{
    const r = await fetch('/api/diavgeia?q='+encodeURIComponent(q)+'&page='+page, {cache:'no-store'});
    const d = await r.json();
    if(d.error){
      resultsEl.innerHTML = '<div class="state">Σφάλμα: '+esc(d.error)+
        '<br><span class="hint">Αν μόλις στήθηκε το /api/diavgeia, κάνε ένα redeploy στο Cloudflare Pages.</span></div>';
      loading = false; return;
    }
    const items = d.items || [];
    curTotal = d.total || items.length;
    if(page === 0){
      if(!items.length){
        resultsEl.innerHTML = '<div class="state">Καμία απόφαση για <b>'+esc(q)+'</b>.</div>';
        loading = false; return;
      }
      resultsEl.innerHTML = items.map(rowHtml).join('');
    } else {
      // append (remove old "more" button first)
      const old = document.getElementById('moreWrap'); if(old) old.remove();
      resultsEl.insertAdjacentHTML('beforeend', items.map(rowHtml).join(''));
    }
    curPage = page;
    const shown = countRows();
    statsEl.innerHTML = 'Βρέθηκαν <b>'+curTotal+'</b> · εμφανίζονται '+shown;
    // add "load more" if there's more
    if(shown < curTotal && items.length){
      resultsEl.insertAdjacentHTML('beforeend',
        '<div id="moreWrap"><button class="more" id="moreBtn">Περισσότερα ('+(curTotal-shown)+')</button></div>');
      document.getElementById('moreBtn').addEventListener('click', ()=>run(curQ, curPage+1));
    }
  }catch(e){
    resultsEl.innerHTML = '<div class="state">Πρόβλημα δικτύου. Δοκίμασε ξανά.</div>';
  }
  loading = false;
}

function countRows(){ return resultsEl.querySelectorAll('.row').length; }

function submit(){
  const q = box.value.trim();
  if(q) run(q, 0);
}
goBtn.addEventListener('click', submit);
box.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); }});

// If opened as diavgeia.html?q=…  (e.g. from the DIAV command) run it immediately.
(function(){
  const q = new URLSearchParams(location.search).get('q');
  if(q){ box.value = q; run(q, 0); }
  else { box.focus(); }
})();
</script>
</body></html>
