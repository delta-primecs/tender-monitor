const listEl=document.getElementById('list'), emptyEl=document.getElementById('empty'), qEl=document.getElementById('q');
function ago(ts){

  if(d<=0) return 'σήμερα'; if(d===1) return 'χθες'; return 'πριν '+d+' ημ.';
}
function render(){

}
